name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# Jeden przebieg naraz na gałąź. Na main kolejne przebiegi czekają (bez anulowania), więc deploy
# starszego commita nigdy nie nadpisze nowszego. Na innych gałęziach nowszy push anuluje starszy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: audit › check › build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # check-secrets przeszukuje całą historię git, a nie tylko ostatni commit.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: deploy na GitHub Pages
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    name: test dymny demo i backendu
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # GITHUB_SHA ustawia Actions: test czeka, aż Pages poda wersję z tego commita.
      - run: node scripts/smoke.mjs
        env:
          API_URL: ${{ vars.VITE_API_URL }}
